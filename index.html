<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nature Swipe</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Nature Swipe</h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="swipe" role="tab" aria-selected="true">Swipe</button>
      <button class="tab" data-view="liked" role="tab" aria-selected="false">
        Liked <span class="badge" id="liked-count">0</span>
      </button>
      <button class="tab" data-view="boards" role="tab" aria-selected="false">Boards</button>
    </nav>
  </header>

  <main>
    <!-- Swipe view -->
    <section class="view is-active" id="view-swipe" aria-label="Swipe photos">
      <div class="stage">
        <div class="deck" id="deck" aria-live="polite"></div>

        <div class="status" id="status" hidden>
          <p id="status-text"></p>
          <button class="btn" id="status-action" hidden></button>
        </div>

        <!-- Floats over the bottom of the photo -->
        <div class="controls">
          <button class="round nope" id="btn-nope" aria-label="No (left arrow)" title="No (←)">
            <span class="emoji" aria-hidden="true">❌</span>
          </button>
          <button class="round undo" id="btn-undo" aria-label="Undo (backspace)" title="Undo (Backspace)">
            <span class="emoji" aria-hidden="true">⏪</span>
          </button>
          <button class="round like" id="btn-like" aria-label="Yes (right arrow)" title="Yes (→)">
            <span class="emoji" aria-hidden="true">🔥</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Liked view -->
    <section class="view" id="view-liked" aria-label="Liked photos">
      <div class="liked-head">
        <h2>Liked</h2>
        <button class="btn ghost" id="clear-liked">Clear all</button>
      </div>
      <p class="empty" id="liked-empty">Nothing yet. Swipe right on a photo you like.</p>
      <ul class="grid" id="liked-grid"></ul>
    </section>

    <!-- Boards view -->
    <section class="view" id="view-boards" aria-label="Pinterest boards">
      <h2>Boards</h2>
      <p class="muted">Photos come from these public Pinterest boards.</p>
      <form class="add-board" id="add-board">
        <input id="board-input" type="text" placeholder="https://www.pinterest.com/user/board/" autocomplete="off" aria-label="Board link">
        <button class="btn" type="submit">Add</button>
      </form>
      <p class="form-error" id="board-error" hidden></p>
      <div class="static-note" id="static-note" hidden>
        <p>This hosted version uses a saved list of photos. To add a board, put it in
          <code>boards.json</code> in the GitHub repo. A daily update pulls in its photos.
          <a id="static-repo-link" target="_blank" rel="noopener" hidden>Edit boards.json</a></p>
        <p class="muted" id="static-updated"></p>
      </div>
      <ul class="board-list" id="board-list"></ul>
      <div class="board-actions">
        <button class="btn ghost" id="reset-boards">Reset to defaults</button>
        <button class="btn ghost" id="reset-seen">Show seen photos again</button>
      </div>
    </section>
  </main>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button class="btn ghost viewer-close" id="viewer-close">Done</button>
    <img id="viewer-img" alt="">
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button class="toast-action" id="toast-action" hidden></button>
  </div>

  <template id="card-template">
    <article class="card">
      <img alt="" draggable="false">
      <span class="stamp stamp-like" aria-hidden="true">🔥</span>
      <span class="stamp stamp-nope" aria-hidden="true">❌</span>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
